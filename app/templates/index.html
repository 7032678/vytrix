<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vytrix Insurance Platform</title>
    <style>
        /* Global Styles */
        * {
          margin: 0;
          padding: 0;
          box-sizing: border-box;
        }

        body {
          font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen',
            'Ubuntu', 'Cantarell', 'Fira Sans', 'Droid Sans', 'Helvetica Neue',
            sans-serif;
          -webkit-font-smoothing: antialiased;
          -moz-osx-font-smoothing: grayscale;
          background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
          min-height: 100vh;
          padding: 20px;
        }

        .container {
          max-width: 500px;
          margin: 0 auto;
          background: white;
          border-radius: 20px;
          box-shadow: 0 20px 40px rgba(0,0,0,0.1);
          overflow: hidden;
        }

        .header {
          background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
          color: white;
          padding: 30px 20px;
          text-align: center;
        }

        .header h1 {
          font-size: 28px;
          margin-bottom: 10px;
        }

        .header p {
          opacity: 0.9;
          font-size: 16px;
        }

        .page {
          padding: 30px;
        }

        .form-group {
          margin-bottom: 20px;
        }

        .form-group label {
          display: block;
          margin-bottom: 8px;
          font-weight: 600;
          color: #333;
        }

        .form-group input,
        .form-group select {
          width: 100%;
          padding: 12px 16px;
          border: 2px solid #e1e5e9;
          border-radius: 10px;
          font-size: 16px;
          transition: border-color 0.3s;
        }

        .form-group input:focus,
        .form-group select:focus {
          outline: none;
          border-color: #4facfe;
        }

        .btn {
          width: 100%;
          padding: 15px;
          background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
          color: white;
          border: none;
          border-radius: 10px;
          font-size: 16px;
          font-weight: 600;
          cursor: pointer;
          transition: transform 0.2s;
        }

        .btn:hover {
          transform: translateY(-2px);
        }

        .btn:disabled {
          opacity: 0.6;
          cursor: not-allowed;
          transform: none;
        }

        .btn.back-btn {
          background: #6c757d;
          margin-bottom: 20px;
        }

        .premium-card {
          background: #f8f9fa;
          border-radius: 15px;
          padding: 20px;
          margin: 20px 0;
          border-left: 4px solid #4facfe;
        }

        .premium-row {
          display: flex;
          justify-content: space-between;
          margin-bottom: 10px;
        }

        .premium-row.total {
          font-weight: bold;
          font-size: 18px;
          border-top: 2px solid #ddd;
          padding-top: 10px;
          margin-top: 15px;
        }

        .simulation-buttons {
          display: grid;
          grid-template-columns: 1fr;
          gap: 15px;
          margin: 20px 0;
        }

        .sim-btn {
          padding: 15px;
          border: 2px solid #ddd;
          border-radius: 10px;
          background: white;
          cursor: pointer;
          transition: all 0.3s;
          font-size: 16px;
          text-align: left;
        }

        .sim-btn:hover {
          border-color: #4facfe;
          background: #f0f8ff;
        }

        .sim-btn.rain {
          border-color: #3498db;
          color: #3498db;
        }

        .sim-btn.fraud {
          border-color: #e74c3c;
          color: #e74c3c;
        }

        .sim-btn.no-activity {
          border-color: #f39c12;
          color: #f39c12;
        }

        .sim-btn-title {
          font-weight: bold;
          margin-bottom: 5px;
        }

        .sim-btn-desc {
          font-size: 12px;
          opacity: 0.8;
        }

        .result-card {
          background: #f8f9fa;
          border-radius: 15px;
          padding: 20px;
          margin: 20px 0;
        }

        .result-header {
          display: flex;
          justify-content: space-between;
          align-items: center;
          margin-bottom: 15px;
        }

        .status {
          padding: 8px 16px;
          border-radius: 20px;
          font-weight: bold;
          font-size: 14px;
        }

        .status.approved {
          background: #d4edda;
          color: #155724;
        }

        .status.rejected {
          background: #f8d7da;
          color: #721c24;
        }

        .status.under-review {
          background: #fff3cd;
          color: #856404;
        }

        .score-display {
          display: grid;
          grid-template-columns: 1fr 1fr;
          gap: 15px;
          margin: 15px 0;
        }

        .score-item {
          text-align: center;
          padding: 15px;
          background: white;
          border-radius: 10px;
        }

        .score-value {
          font-size: 24px;
          font-weight: bold;
          color: #4facfe;
        }

        .score-label {
          font-size: 12px;
          color: #666;
          margin-top: 5px;
        }

        .reasons {
          margin-top: 15px;
        }

        .reasons h4 {
          margin-bottom: 10px;
          color: #333;
        }

        .reasons ul {
          list-style: none;
        }

        .reasons li {
          padding: 8px 0;
          border-bottom: 1px solid #eee;
        }

        .reasons li:before {
          content: "•";
          color: #4facfe;
          font-weight: bold;
          margin-right: 10px;
        }

        .loading {
          text-align: center;
          padding: 40px;
        }

        .spinner {
          border: 4px solid #f3f3f3;
          border-top: 4px solid #4facfe;
          border-radius: 50%;
          width: 40px;
          height: 40px;
          animation: spin 1s linear infinite;
          margin: 0 auto 20px;
        }

        @keyframes spin {
          0% { transform: rotate(0deg); }
          100% { transform: rotate(360deg); }
        }

        .error-message {
          background: #f8d7da;
          color: #721c24;
          padding: 15px;
          border-radius: 10px;
          margin: 15px 0;
          border: 1px solid #f5c6cb;
        }

        .success-message {
          background: #d4edda;
          color: #155724;
          padding: 15px;
          border-radius: 10px;
          margin: 15px 0;
          border: 1px solid #c3e6cb;
        }

        /* Hide all pages by default */
        .page {
          display: none;
        }

        /* Show active page */
        .page.active {
          display: block;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Registration Page -->
        <div id="registrationPage" class="page active">
            <div class="header">
                <h1>🛡️ Vytrix Insurance</h1>
                <p>AI-powered parametric insurance for gig workers</p>
            </div>
            <div class="page">
                <form id="registerForm">
                    <div class="form-group">
                        <label for="name">Full Name</label>
                        <input type="text" id="name" placeholder="Enter your full name" required>
                    </div>
                    <div class="form-group">
                        <label for="phone">Phone Number</label>
                        <input type="tel" id="phone" placeholder="10-digit mobile number" required>
                    </div>
                    <div class="form-group">
                        <label for="zone">Work Zone</label>
                        <select id="zone" required>
                            <option value="">Select your work zone</option>
                            <option value="urban">Urban</option>
                            <option value="suburban">Suburban</option>
                            <option value="rural">Rural</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="shift">Shift Timing</label>
                        <select id="shift" required>
                            <option value="">Select your shift</option>
                            <option value="morning">Morning (6AM-2PM)</option>
                            <option value="afternoon">Afternoon (2PM-10PM)</option>
                            <option value="night">Night (10PM-6AM)</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="platform">Delivery Platform</label>
                        <select id="platform" required>
                            <option value="">Select your platform</option>
                            <option value="swiggy">Swiggy</option>
                            <option value="zomato">Zomato</option>
                            <option value="uber_eats">Uber Eats</option>
                            <option value="doordash">DoorDash</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="vehicle">Vehicle Type</label>
                        <select id="vehicle" required>
                            <option value="">Select your vehicle</option>
                            <option value="bike">Bike</option>
                            <option value="scooter">Scooter</option>
                            <option value="car">Car</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="earnings">Average Daily Earnings (₹)</label>
                        <input type="number" id="earnings" placeholder="e.g., 600" min="200" max="2000" required>
                    </div>
                    <button type="submit" class="btn">Get Insurance Quote</button>
                </form>
                <div id="registerError" class="error-message" style="display: none;"></div>
            </div>
        </div>

        <!-- Premium Page -->
        <div id="premiumPage" class="page">
            <div class="header">
                <h1>💰 Your Premium</h1>
                <p>Calculated based on your risk profile</p>
            </div>
            <div class="page">
                <button class="btn back-btn" onclick="showPage('registrationPage')">← Back to Registration</button>
                <div id="premiumCard" class="premium-card">
                    <!-- Premium details will be populated by JavaScript -->
                </div>
                <button class="btn" onclick="showPage('triggerPage')">Continue to Simulation</button>
            </div>
        </div>

        <!-- Trigger Page -->
        <div id="triggerPage" class="page">
            <div class="header">
                <h1>🎯 Test Scenarios</h1>
                <p>Simulate different claim scenarios</p>
            </div>
            <div class="page">
                <button class="btn back-btn" onclick="showPage('premiumPage')">← Back to Premium</button>
                <div class="simulation-buttons">
                    <button class="sim-btn rain" onclick="runSimulation('rain')">
                        <div class="sim-btn-title">🌧️ Rain Scenario</div>
                        <div class="sim-btn-desc">Heavy rain affecting deliveries</div>
                    </button>
                    <button class="sim-btn fraud" onclick="runSimulation('fraud')">
                        <div class="sim-btn-title">🚫 Fraud Scenario</div>
                        <div class="sim-btn-desc">Suspicious activity detected</div>
                    </button>
                    <button class="sim-btn no-activity" onclick="runSimulation('no-activity')">
                        <div class="sim-btn-title">📉 No Activity Scenario</div>
                        <div class="sim-btn-desc">No deliveries during shift</div>
                    </button>
                </div>
            </div>
        </div>

        <!-- Result Page -->
        <div id="resultPage" class="page">
            <div class="header">
                <h1>📊 Simulation Results</h1>
                <p>AI-powered claim assessment</p>
            </div>
            <div class="page">
                <button class="btn back-btn" onclick="showPage('triggerPage')">← Run Another Simulation</button>
                <div id="resultCard" class="result-card">
                    <!-- Results will be populated by JavaScript -->
                </div>
            </div>
        </div>

        <!-- Loading Page -->
        <div id="loadingPage" class="page">
            <div class="header">
                <h1>⚡ Processing</h1>
                <p>Analyzing your claim...</p>
            </div>
            <div class="page">
                <div class="loading">
                    <div class="spinner"></div>
                    <p>Running AI assessment...</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        let currentUser = null;
        let currentPremium = null;

        // Page navigation
        function showPage(pageId) {
            document.querySelectorAll('.page').forEach(page => {
                page.classList.remove('active');
            });
            document.getElementById(pageId).classList.add('active');
        }

        // Registration form handler
        document.getElementById('registerForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const errorDiv = document.getElementById('registerError');
            errorDiv.style.display = 'none';

            const data = {
                name: document.getElementById('name').value,
                phone: document.getElementById('phone').value,
                zone: document.getElementById('zone').value,
                shift: document.getElementById('shift').value,
                platform: document.getElementById('platform').value,
                vehicle: document.getElementById('vehicle').value,
                earnings: parseFloat(document.getElementById('earnings').value)
            };

            try {
                const response = await fetch('/api/users/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });

                const result = await response.json();
                if (response.ok) {
                    currentUser = result.user;
                    await calculatePremium(result.user.user_id);
                } else {
                    errorDiv.textContent = result.error || 'Registration failed';
                    errorDiv.style.display = 'block';
                }
            } catch (error) {
                errorDiv.textContent = 'Network error. Please try again.';
                errorDiv.style.display = 'block';
            }
        });

        // Calculate premium
        async function calculatePremium(userId) {
            try {
                const response = await fetch('/api/policies/calculate-premium', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ user_id: userId })
                });

                const result = await response.json();
                if (response.ok) {
                    currentPremium = result;
                    displayPremium(result);
                    showPage('premiumPage');
                }
            } catch (error) {
                console.error('Premium calculation failed:', error);
            }
        }

        // Display premium
        function displayPremium(premium) {
            const card = document.getElementById('premiumCard');
            card.innerHTML = `
                <div class="premium-row">
                    <span>Base Premium:</span>
                    <span>₹${premium.base_premium}</span>
                </div>
                <div class="premium-row">
                    <span>Zone Risk Adjustment:</span>
                    <span>₹${premium.zone_risk_adjustment}</span>
                </div>
                <div class="premium-row">
                    <span>Weather Risk Adjustment:</span>
                    <span>₹${premium.weather_risk_adjustment}</span>
                </div>
                <div class="premium-row total">
                    <span>Monthly Premium:</span>
                    <span>₹${premium.final_premium}</span>
                </div>
                <div class="premium-row">
                    <span>Coverage Amount:</span>
                    <span>₹${premium.coverage_amount}</span>
                </div>
            `;
        }

        // Run simulation
        async function runSimulation(scenario) {
            showPage('loadingPage');

            try {
                const endpoint = `/api/simulations/${scenario}`;
                const response = await fetch(endpoint, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ user_id: currentUser.user_id })
                });

                const result = await response.json();
                if (response.ok) {
                    displayResult(result);
                    showPage('resultPage');
                }
            } catch (error) {
                console.error('Simulation failed:', error);
                showPage('triggerPage');
            }
        }

        // Display result
        function displayResult(result) {
            const card = document.getElementById('resultCard');
            const statusClass = result.status.toLowerCase().replace('_', '-');

            card.innerHTML = `
                <div class="result-header">
                    <h3>Claim Assessment</h3>
                    <span class="status ${statusClass}">${result.status.replace('_', ' ')}</span>
                </div>

                <div class="score-display">
                    <div class="score-item">
                        <div class="score-value">${(result.opportunity_score * 100).toFixed(0)}%</div>
                        <div class="score-label">Opportunity Loss</div>
                    </div>
                    <div class="score-item">
                        <div class="score-value">${(result.fraud_score * 100).toFixed(0)}%</div>
                        <div class="score-label">Fraud Risk</div>
                    </div>
                </div>

                ${result.claim_amount ? `<div class="premium-row total" style="margin: 15px 0;">
                    <span>Claim Amount:</span>
                    <span>₹${result.claim_amount}</span>
                </div>` : ''}

                <div class="reasons">
                    <h4>Assessment Details:</h4>
                    <ul>
                        ${result.reasons.map(reason => `<li>${reason}</li>`).join('')}
                    </ul>
                </div>
            `;
        }
    </script>
</body>
</html>
